<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Which Colour Are You?</title>
<meta name="description" content="A 10-question quiz to find your personality colour: Red, Yellow, Green or Blue.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<main id="app">

  <section id="start" class="screen active">
    <p class="eyebrow">Personality Colour Quiz</p>
    <h1>Which <span class="rainbow">colour</span> are you?</h1>
    <p class="sub">10 quick questions. Pick what feels most like you, not what sounds best.</p>
    <button class="btn" id="startBtn">Start the quiz</button>
    <div class="dots"><b style="--c:#ff4d4d"></b><b style="--c:#ffc933"></b><b style="--c:#3ecf8e"></b><b style="--c:#4d8dff"></b></div>
  </section>

  <section id="quiz" class="screen">
    <div class="progress"><div id="bar"></div></div>
    <p class="count" id="count"></p>
    <h2 id="question"></h2>
    <div class="answers" id="answers"></div>
    <p class="hint">Tip: press 1, 2, 3 or 4 on your keyboard</p>
  </section>

  <section id="loading" class="screen">
    <div class="mixer"><b></b><b></b><b></b><b></b></div>
    <p class="sub">Mixing your colours...</p>
  </section>

  <section id="result" class="screen"></section>

</main>
<script src="script.js"></script>
</body>
</html>
